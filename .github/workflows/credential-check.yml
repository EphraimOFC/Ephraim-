name: Credential regression checks
on:
  push:
    branches: [security/gemini-env-key]
  pull_request:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check AI plugin syntax
        run: node --check plugins/ai.js
      - name: Ensure AI plugin uses environment credentials
        run: grep -q 'process.env.GEMINI_API_KEY' plugins/ai.js
