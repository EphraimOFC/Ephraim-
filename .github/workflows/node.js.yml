name: Node.js CI

on:
  push:
    branches: [ "security/gemini-env-key" ]
  pull_request:
    branches: [ "main" ]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Syntax-check core and AI plugin
        run: |
          node --check index.js
          node --check plugins/ai.js
